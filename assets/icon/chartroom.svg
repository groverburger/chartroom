<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Chartroom app icon. Master artwork: scripts/make_icons.py renders every platform size from it.
       The tile follows the macOS grid (824 px tile with 100 px margins); other platforms crop to the tile. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2836"/>
      <stop offset="1" stop-color="#0b1017"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.3" r="0.65">
      <stop offset="0" stop-color="#3a8fe8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3a8fe8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="up" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ee3c1"/>
      <stop offset="1" stop-color="#22a888"/>
    </linearGradient>
    <linearGradient id="down" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8590"/>
      <stop offset="1" stop-color="#e04a59"/>
    </linearGradient>
    <linearGradient id="trend" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#66abff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#8cc2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3"/>

  <!-- Price grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="4">
    <line x1="190" y1="330" x2="834" y2="330"/>
    <line x1="190" y1="510" x2="834" y2="510"/>
    <line x1="190" y1="690" x2="834" y2="690"/>
  </g>

  <!-- Trend line through the closes -->
  <path d="M 228 712 C 360 690, 420 600, 530 540 S 720 330, 812 262" fill="none" stroke="url(#trend)"
        stroke-width="14" stroke-linecap="round"/>

  <!-- Candles: up, down, up, up -->
  <g filter="url(#shadow)">
    <g stroke-linecap="round" stroke-width="16">
      <line x1="291" y1="560" x2="291" y2="790" stroke="#22a888"/>
      <line x1="441" y1="480" x2="441" y2="700" stroke="#e04a59"/>
      <line x1="591" y1="360" x2="591" y2="640" stroke="#22a888"/>
      <line x1="741" y1="210" x2="741" y2="520" stroke="#3cc6a3"/>
    </g>
    <rect x="236" y="610" width="110" height="140" rx="16" fill="url(#up)"/>
    <rect x="386" y="520" width="110" height="130" rx="16" fill="url(#down)"/>
    <rect x="536" y="410" width="110" height="190" rx="16" fill="url(#up)"/>
    <rect x="686" y="250" width="110" height="230" rx="16" fill="url(#up)"/>
  </g>
</svg>
